<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TripCanvas · 旅行规划</title><link rel="stylesheet" href="styles.css"></head>
<body><main>
  <section class="hero"><span class="eyebrow">SINGLE-USER TRAVEL PLANNER</span><h1>把想去的地方，变成<br><em>可出发的计划。</em></h1><p>输入一句旅行愿望，获得逐日路线、预算拆分和贴心风险提醒。</p></section>
  <section class="planner card"><div class="section-title"><div><span class="step">01</span><h2>告诉我你的旅行</h2></div><span class="status">AI 规划中枢</span></div>
    <form id="trip-form"><div class="grid"><label>目的地<input name="destination" required placeholder="如：京都、日本"></label><label>旅行天数<input name="days" required type="number" min="1" max="30" value="4"></label><label>总预算（CNY）<input name="budget" required type="number" min="100" value="6000"></label><label>出行时间<input name="time" placeholder="如：10 月上旬 / 2026-10-01"></label></div><label>旅行偏好<textarea name="preferences" placeholder="如：慢节奏、咖啡店、自然风光、当地美食"></textarea></label><label>禁忌与限制<textarea name="constraints" placeholder="如：不吃牛肉、避免高强度徒步、不安排夜间出行"></textarea></label><button type="submit">生成我的旅行方案 <span>→</span></button></form>
  </section>
  <section id="result" hidden><div class="result-heading"><div><span class="step">02</span><h2>你的专属行程</h2></div><button id="reset" class="text-btn">重新编辑</button></div><div id="demo-note" class="notice" hidden>当前为演示方案。配置 <code>OPENAI_API_KEY</code> 后，即会改由 GPT 生成。</div><div class="notice verify-note">路线包含地点、地址/区域、停留时长与交通建议。带“需核验”的项目请在出发前通过地图或官方渠道确认。</div><div class="requirements card"><div><span>目的地</span><strong id="r-destination"></strong></div><div><span>时间</span><strong id="r-time"></strong></div><div><span>预算</span><strong id="r-budget"></strong></div><div><span>偏好</span><strong id="r-preferences"></strong></div></div><div class="result-grid"><div id="itinerary" class="itinerary"></div><aside><div class="card side-card"><h3>预算估算</h3><div id="budget-lines"></div></div><div class="card side-card"><h3>出行提醒</h3><div id="risks"></div></div><div class="card side-card"><h3>小贴士</h3><ul id="tips"></ul></div></aside></div></section>
</main><footer>TripCanvas MVP · 预算与安排为建议，请在出发前确认实际情况。</footer><script src="app.js"></script></body></html>
